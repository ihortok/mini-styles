<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini styles demo</title>
  <link rel="stylesheet" href="../dist/mini-styles.css">
  <style>
    body { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; }
    header { border-bottom: 3px double var(--mini-color-border); padding-bottom: 1rem; margin-bottom: 2rem; }
    header p { color: var(--mini-color-muted); }
    section { margin-bottom: 2rem; }
    section > h2 { border-bottom: 1px solid var(--mini-color-border); padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .row { display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Mini styles</h1>
    <p>A small collection of everyday web elements.</p>
    <nav aria-label="Demo sections">
      <a href="#buttons-heading">Buttons</a> &middot;
      <a href="#cards-heading">Cards</a> &middot;
      <a href="#forms-heading">Forms</a>
    </nav>
  </header>

  <section aria-labelledby="buttons-heading">
    <h2 id="buttons-heading">01. Buttons</h2>
    <div class="row">
      <button class="mini-btn">Primary</button>
      <button class="mini-btn mini-btn--danger">Danger</button>
      <button class="mini-btn mini-btn--outline">Outline</button>
      <button class="mini-btn" disabled>Disabled</button>
    </div>
  </section>

  <section aria-labelledby="cards-heading">
    <h2 id="cards-heading">02. Cards</h2>
    <div class="row">
      <div class="mini-card">
        <h3>From the notice board</h3>
        <p>A simple space for a short update, a useful reference, or a note to your readers.</p>
        <button class="mini-btn">Read more</button>
      </div>
    </div>
  </section>

  <section aria-labelledby="forms-heading">
    <h2 id="forms-heading">03. Forms</h2>
    <form class="mini-form">
      <div>
        <label class="mini-label" for="name">Name</label>
        <input class="mini-input" id="name" name="name" type="text" autocomplete="name" placeholder="Jane Doe">
      </div>
      <div>
        <label class="mini-label" for="email">Email</label>
        <input class="mini-input" id="email" name="email" type="email" autocomplete="email" placeholder="jane@example.com">
      </div>
      <div>
        <label class="mini-label" for="topic">Topic</label>
        <select class="mini-select" id="topic" name="topic">
          <option value="">Choose a topic</option>
          <option value="general">General question</option>
          <option value="feedback">Feedback</option>
        </select>
      </div>
      <div>
        <label class="mini-label" for="message">Message</label>
        <textarea class="mini-textarea" id="message" name="message" rows="4" placeholder="Your message"></textarea>
      </div>
      <div>
        <label class="mini-label" for="disabled-input">Disabled input</label>
        <input class="mini-input" id="disabled-input" type="text" value="Unavailable" disabled>
      </div>
      <div>
        <button class="mini-btn" type="button">Send message</button>
      </div>
    </form>
  </section>
</body>
</html>
